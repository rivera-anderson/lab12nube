{% extends 'base.html' %}

{% block title %}Crear Cuenta - Fijas Infinitas 2026{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-10 px-4">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
        
        <div class="text-center mb-6">
            <div class="h-11 px-4 rounded-xl bg-fijas-orange inline-flex items-center justify-center text-white font-heading font-black text-xl tracking-tight mb-3 shadow-sm">
                <i class="fa-solid fa-fire text-amber-300 mr-2"></i>
                <span>FIJAS INFINITAS</span>
            </div>
            <h1 class="text-xl font-heading font-black text-slate-900">Registro de Participante</h1>
            <p class="text-xs text-slate-500 mt-1">Crea tu usuario para participar y sumar puntos</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-heading font-bold uppercase tracking-wider text-slate-700 mb-1.5">Nombre Completo</label>
                <input type="text" name="first_name" placeholder="Anderson Sánchez"
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-900 placeholder-slate-400 focus:border-fijas-orange focus:bg-white focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-heading font-bold uppercase tracking-wider text-slate-700 mb-1.5">Nombre de Usuario (Login)</label>
                <input type="text" name="username" required placeholder="anderson_26"
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-900 placeholder-slate-400 focus:border-fijas-orange focus:bg-white focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-heading font-bold uppercase tracking-wider text-slate-700 mb-1.5">Correo Electrónico</label>
                <input type="email" name="email" placeholder="usuario@correo.com"
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-900 placeholder-slate-400 focus:border-fijas-orange focus:bg-white focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-heading font-bold uppercase tracking-wider text-slate-700 mb-1.5">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-900 placeholder-slate-400 focus:border-fijas-orange focus:bg-white focus:outline-none">
            </div>

            <button type="submit" class="w-full py-3 bg-fijas-orange hover:bg-fijas-orangeHover text-white font-heading font-black text-xs uppercase tracking-wider rounded-xl shadow-sm transition betano-glow-sm">
                Completar Registro
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
            ¿Ya tienes cuenta?
            <a href="{% url 'login' %}" class="text-fijas-orange font-heading font-bold hover:underline ml-1">Inicia sesión</a>
        </div>
    </div>
</div>
{% endblock %}
