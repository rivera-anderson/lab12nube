worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" $request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server {
        listen 80;
        server_name localhost;

        # DNS interno de Docker (habilita round-robin dinamico entre replicas)
        resolver 127.0.0.11 valid=2s ipv6=off;

        # Verificación de salud directa para el balanceador
        location /lb-health {
            access_log off;
            return 200 '{"status": "load_balancer_active", "strategy": "round_robin"}\n';
            add_header Content-Type application/json;
        }

        # Proxy inverso hacia las réplicas backend con rotación DNS Docker
        location / {
            set $backend_upstream "backend:8000";
            proxy_pass http://$backend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pasar cabeceras de identificación de réplica inyectadas por el middleware
            proxy_pass_header X-Served-By;
            proxy_pass_header X-Process-PID;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
